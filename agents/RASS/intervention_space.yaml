version: 2
agent: RASS
layer: alpha
group_rule: exactly_one_group_per_round

groups:
  initial_feature_bootstrap:
    operation: append_to_target_count
    target_path: z_alpha.selected_features
    source_path: z_alpha.feature_pool
    allowed_while_alpha_frozen: false
    maximum_failed_executed_candidates: 3
    allowed_initial_counts: [5]
    target_total_count: 8
    additions_rule: target_total_count_minus_initial_count
    selection_mode: agent_exploration
    exploration_stages: 2
    shortlist_size: 12
    final_selection_must_be_subset_of_shortlist: true
    deterministic_eligibility:
      minimum_total_coverage: 0.90
      minimum_valid_ic_date_ratio: 0.80
      minimum_nonconstant_cross_section_ratio: 0.90
      duplicate_anchor_forbidden: true
    shortlist_joint_evidence:
      - daily_cross_sectional_pairwise_correlation
      - anchor_residual_ic
      - anchor_residual_icir
      - anchor_residual_rank_ic
      - positive_residual_ic_ratio
      - rolling_period_anchor_residual_metrics
    fixed_rolling_development_evidence:
      method: three_complete_calendar_years_before_task_run_id
      period_rule: [Y-3, Y-2, Y-1]
      exact_dates_source: frozen_qlib_calendar
      t_plus_2_label_must_remain_inside_each_period: true
      preferred_metrics: [rank_ic, rank_icir, ic, icir]
      deterministic_score_or_top_k_forbidden: true
    agent_must_use_frozen_development_evidence: true
    test_visible_to_rass: false
    deterministic_selector_forbidden: true
    require_resolvable_by_qlib: true
    require_not_already_selected: true
    preserve_all_initial_features: true
    forbid_removal: true
    forbid_replacement: true
    forbid_manual_expression_outside_pool: true
    freeze_evidence_after_success: true
    acceptance_mode: ordinary_validation_gate
    promotion_verdicts: [SUPPORTED, PARTIALLY_SUPPORTED]
    retry_set_rule: partial_overlap_allowed_but_complete_three_factor_set_must_differ
    three_failure_action: freeze_original_five_features_and_continue_to_fama_rapa
    validation_gate_verdict_usage: controls_promotion

# Before a formal run, resolve the named Qlib feature_pool into a deterministic
# candidate catalog, persist it with a content hash, and freeze it. For the
# current trajectory, every bounded RASS attempt uses the same frozen three-calendar-year development evidence;
# the agent preserves the initial features and explores the catalog to
# propose enough non-duplicate additions to reach eight. Deterministic code validates
# membership, evidence provenance, counts, and leakage boundaries, but does not
# select or rank factors on the agent's behalf. After successful
# execution the ordinary agent-valid portfolio Gate accepts or rejects the
# candidate. Rejected candidates roll back to the five anchors; after three
# failures the five-factor alpha is frozen and downstream optimization begins.
